<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海关报关智能助手</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-light: #e3f2fd;
            --bg-color: #f4f7f6;
            --chat-bg: #ffffff;
            --text-color: #333;
            --bot-msg-bg: #f1f0f0;
            --user-msg-bg: #007bff;
            --user-msg-text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            white-space: pre-wrap; /* Keeps formatting from AI */
        }

        .input-area {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Loading indicator styling */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            padding: 10px 15px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            margin-bottom: 10px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #aaa;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>📦 海关报关智能助手</h1>
        <p>基于 DeepSeek 实时分析仓库库存与风险预警</p>
    </div>
    
    <div id="chat-box">
        <div class="message bot">你好！我是你的智能报关助手。我已经扫描了你的仓库库存。请问有什么可以帮你？<br>你可以问我：<br>“分析当前库存的关税风险”<br>“这些产品需要什么许可证？”</div>
    </div>

    <div class="typing-indicator" id="loading">
        <span></span><span></span><span></span>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const loadingIndicator = document.getElementById('loading');
        const message = inputField.value.trim();
        
        if (!message) return;

        // Display user message
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.textContent = message;
        chatBox.appendChild(userDiv);
        
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Show loading
        loadingIndicator.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Create bot message container but keep it hidden until we have data
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        
        try {
            const response = await fetch(`/sales/deepseek/?msg=${encodeURIComponent(message)}`);
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            // Hide loading and show bot message container
            loadingIndicator.style.display = 'none';
            chatBox.appendChild(botDiv);

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const text = decoder.decode(value, { stream: true });
                botDiv.textContent += text;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (error) {
            loadingIndicator.style.display = 'none';
            botDiv.textContent = "⚠️ 连接失败，请检查网络或稍后重试。";
            chatBox.appendChild(botDiv);
            console.error(error);
        }
    }
</script>

</body>
</html>
